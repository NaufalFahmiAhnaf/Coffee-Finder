version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: backend-coffee-postgres
    environment:
      POSTGRES_DB: backend_coffee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - backend_coffee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_coffee"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend-coffee-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: backend-coffee-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@backendcoffee.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend-coffee-network
    profiles:
      - dev

volumes:
  backend_coffee_postgres_data:
    driver: local

networks:
  backend-coffee-network:
    driver: bridge
